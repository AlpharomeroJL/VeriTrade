[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"
fs_permissions = [{ access = "write", path = "./evidence" }]

[profile.ci]
fuzz = { runs = 100 }

# Public JSON-RPC defaults (override with SEPOLIA_RPC_URL / --rpc-url when running scripts).
[rpc_endpoints]
sepolia = "https://ethereum-sepolia.publicnode.com"
